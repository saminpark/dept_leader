<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142e32">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https://docs.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>실장 업무실 · Fran:D</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="seed.js" defer></script>
  <script src="core.js" defer></script>
  <script src="google-docs.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 이동</a>
  <div id="app">
    <aside id="sidebar" class="sidebar" aria-label="업무 탐색"></aside>
    <button id="navBackdrop" class="nav-backdrop" aria-label="메뉴 닫기" hidden></button>
    <div class="shell">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-only" id="menuButton" aria-label="업무 메뉴 열기" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>Fran:D</span><span class="divider">/</span><strong id="breadcrumb">대시보드</strong></div>
        <form id="searchForm" class="global-search" role="search"><span aria-hidden="true">⌕</span><input id="globalSearch" aria-label="전체 업무 검색" placeholder="업무·담당자·메모 검색" autocomplete="off"><kbd>↵</kbd></form>
        <button class="top-connection" id="connectionShortcut" type="button"><span class="status-dot"></span><span id="connectionLabel">Google 설정</span></button>
        <div class="avatar" title="실장 업무실">실</div>
      </header>
      <div id="noticeHost" aria-live="polite"></div>
      <main id="main-content" tabindex="-1"></main>
      <footer class="app-footer"><span>DIRECTOR DESK <span class="muted">/</span> 실행하고, 기록하고, 다음 단계로.</span><span id="localStatus">이 브라우저에 저장</span></footer>
    </div>
  </div>
  <dialog id="editorDialog" class="dialog editor-dialog" aria-labelledby="editorTitle"></dialog>
  <dialog id="exportDialog" class="dialog export-dialog" aria-labelledby="exportTitle"></dialog>
  <dialog id="confirmDialog" class="dialog confirm-dialog" aria-labelledby="confirmTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="importInput" type="file" accept=".json,application/json" hidden>
  <noscript><p class="noscript">이 페이지는 JavaScript를 켠 브라우저에서 사용할 수 있습니다.</p></noscript>
</body>
</html>
